name: Draft Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Title of the release (e.g., Release v1.0.0)'
        required: true
        default: 'Release v1.0.0'
      release_body:
        description: 'Release description / release notes'
        required: false
        default: 'Manual release build'
      draft:
        description: 'Create the release as a Draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create the release as a Pre-release'
        type: boolean
        required: false
        default: false
      verify_only:
        description: 'Build and verify the signed APK without publishing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository at the manually selected ref/commit
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 17 (required for building Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. Get dependencies
      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 release secret}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/couchmouse-release.jks"

      # 5. Build Flutter release APK
      - name: Build Release APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/couchmouse-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify Android Signing Certificate
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          : "${EXPECTED_SHA256:?Set the ANDROID_SIGNING_CERT_SHA256 repository variable}"
          expected="$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          certificates="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          actual="$(printf '%s\n' "$certificates" |
            sed -nE 's/^.* certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' |
            tr '[:upper:]' '[:lower:]' | sort -u)"
          if [[ ! "$expected" =~ ^[a-f0-9]{64}$ || "$actual" != "$expected" ]]; then
            echo 'APK signing certificate does not match ANDROID_SIGNING_CERT_SHA256.'
            printf '%s\n' "$certificates"
            exit 1
          fi
          printf 'Verified APK signing certificate %s\n' "$actual"

      # 6. Rename APK for professional distribution
      - name: Rename APK
        if: ${{ !inputs.verify_only }}
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/couchmouse-${RELEASE_TAG}.apk"

      # 7. Create GitHub Release and upload APK
      - name: Create GitHub Release
        if: ${{ !inputs.verify_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_title }}
          body: ${{ github.event.inputs.release_body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            build/app/outputs/flutter-apk/couchmouse-${{ github.event.inputs.tag_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
